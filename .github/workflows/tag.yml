name: tag

# Every merge to main gets a tag (#1091).
#
# The release-hygiene gate in ci.yml already makes every merge that changes
# what ships bump the version in Cargo.toml, so the version at the merge
# commit names that binary. This job turns it into `v<version>` on that commit
# and starts release.yml for it, so a merged version is a published release
# rather than a number waiting for someone to remember to cut it.
#
# A merge that ships nothing (docs, CI, tests) keeps the previous version, and
# that version's tag already exists on the commit that introduced it. Moving
# it would change what a published release points at, so such a merge is
# reported and left alone.

on:
  push:
    branches: [main]

# Two merges in quick succession must not race to read "no tag yet" for the
# same version. Queued, not cancelled: a cancelled run is a merge left untagged.
concurrency:
  group: tag-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: tag the merged version
    runs-on: ubuntu-latest
    permissions:
      # Create the tag ref.
      contents: write
      # Dispatch release.yml. A tag created with github.token does not fire
      # `push: tags` workflows (GitHub suppresses token-triggered runs to
      # avoid recursion), but workflow_dispatch is exempt from that rule.
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag is created through the API with GH_TOKEN, so the
          # checkout token is not needed after the fetch.
          persist-credentials: false

      - name: Create v<version> on this commit and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::could not read the package version"
            exit 1
          fi
          tag="v$version"
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            echo "::notice::$tag already exists ($existing); this merge did not bump the version, so there is no new release to tag."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $tag"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Started release.yml for $tag"
